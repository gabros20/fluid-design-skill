name: ci
on:
  push:
    branches: [main, v2-api]
  pull_request:

jobs:
  # The zero-browser suite on every OS the binaries ship for: generated files
  # current, invariants, v1 parity, the CLI end to end (CRLF and formatter
  # cases included), the audit self-test, the zoom-detect table, and the
  # standalone binary for that runner through init / check / calc / explain.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: fluid-design
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: node scripts/test/zoom-detect.mjs
      - uses: oven-sh/setup-bun@v2
      - run: node scripts/build-bin.mjs --target host --smoke

  # The real-browser suites (Chromium, WebKit, Firefox): the engine against
  # the model, scopes and fluidPx, the Tailwind layer through the real
  # compiler, the SCSS module through sass, and explain --url's verdicts.
  # They run from the examples, which carry playwright, tailwind and sass.
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
        working-directory: examples/pizza-next
      - run: npm ci
        working-directory: examples/pizza-vite-gsap
      - run: npx playwright install --with-deps chromium webkit firefox
        working-directory: examples/pizza-next
      - run: npx playwright install chromium webkit firefox
        working-directory: examples/pizza-vite-gsap
      - run: npm run test:browsers
        working-directory: fluid-design
