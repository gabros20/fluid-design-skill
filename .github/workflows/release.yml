# A tag v2.x.y (matching the root package.json, .codex-plugin/plugin.json and
# the newest released CHANGELOG.md heading) builds the standalone binaries,
# attaches them with SHA256SUMS to a GitHub Release (install-cli.sh and
# install-cli.ps1 download from there), and publishes fluid-design-cli to npm
# from the repository root when the NPM_TOKEN secret is set.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - name: tag matches the package and plugin versions
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./.codex-plugin/plugin.json').version")"
      - run: npm test
      - name: binaries (every target) + host smoke test
        run: node scripts/dev/build-bin.mjs --smoke
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "fluid $GITHUB_REF_NAME" --generate-notes
      - name: npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
