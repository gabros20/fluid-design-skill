# A tag v2.x.y builds the standalone binaries,
# attaches them with SHA256SUMS to a GitHub Release (install-cli.sh and
# install-cli.ps1 download from there), and publishes fluid-design-cli to npm
# from the repository root through npm Trusted Publishing: GitHub's OIDC
# identity (id-token: write), no token secret. The package's Trusted
# Publisher on npmjs.com names this repository and this workflow file.
# Both publish steps are idempotent, so re-running a release is safe.
#
# The tag step checks the tag against the root package.json and
# .codex-plugin/plugin.json only. The newest released CHANGELOG.md heading is
# checked against plugin.json by `npm run verify` (scripts/check-sync, through
# scripts/lint-skill), and package.json against SKILL_VERSION by its
# `npm test` (generate-fluid.mjs --check): so all four agree before a release.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - name: tag matches the package and plugin versions
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./.codex-plugin/plugin.json').version")"
      - run: npm run verify
      - name: binaries (every target) + host smoke test
        run: node scripts/dev/build-bin.mjs --smoke
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "fluid $GITHUB_REF_NAME" --generate-notes
          fi
      # Trusted Publishing needs npm 11.5.1+; Node 24 ships 11.x, so upgrade.
      - name: npm (trusted publishing)
        run: |
          npm install -g npm@latest
          v="$(node -p "require('./package.json').version")"
          if npm view "fluid-design-cli@$v" version >/dev/null 2>&1; then
            echo "fluid-design-cli@$v is already on npm; nothing to publish"
          else
            npm publish --access public
          fi
