<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fluid-design verify-matrix fixture</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Unit block below is generated verbatim from lib/fluid-math.mjs
     cssUnits(loadConfig()) at the shipped defaults (reference 1440x900,
     engageAt 1024, floors .58/.82/.90, damping .62/.33, chrome enabled) --
     do not hand-edit the numbers without re-running cssUnits() and pasting
     the result, or this fixture stops being a faithful check of the lib. */
  :root {
    --fluid: 1px;
    --fluid-display: 1px;
    --fluid-copy: 1px;
    --fluid-chrome: 1px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --browser-bar: calc(100lvh - 100svh);
    --header-h: calc(24 * var(--fluid) + var(--safe-top) + 34px);
  }

  @media (width >= 1024px) {
    :root {
      --fluid: max(0.58px, min(calc(100svh / 900), calc(100vw / 1440)));
      --fluid-display: max(0.82px, var(--fluid), calc(0.62 * var(--fluid) + 0.38px));
      --fluid-copy: max(0.9px, var(--fluid), calc(0.33 * var(--fluid) + 0.67px));
      --fluid-chrome: min(calc(100vw / 1440), max(1px, calc(100svh / 900)));
      --header-h: calc(24 * var(--fluid) + var(--safe-top) + 48 * var(--fluid-chrome));
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0b0b0c; color: #eee; font-family: system-ui, sans-serif; }
  html { overflow-x: clip; scroll-behavior: smooth; } /* smooth is what anchor-check.mjs exercises; overflow-x:clip is the one allowed place for the root rule -- see audit.mjs's overflow-hidden-x */

  nav { position: sticky; top: 0; z-index: 1; display: flex; gap: calc(16 * var(--fluid)); padding: calc(12 * var(--fluid)); background: #0b0b0c; border-bottom: 1px solid #333; }
  nav a { color: #9cf; }

  /* Anchor landing offset: this fixture uses scroll-margin-top rather than a
     --header-h read in JS, so anchor-check.mjs's scroll-margin/padding
     candidate is the one expected to match. */
  .filler[id] { scroll-margin-top: var(--header-h); }

  .fit-section {
    height: calc(900 * var(--fluid));
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid #333;
  }

  .filler {
    height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid #222;
    font-size: calc(24 * var(--fluid-display));
  }

  [data-stage-item] {
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  [data-stage-item].is-visible {
    opacity: 1;
  }

  /* Deliberate overflow, gated behind ?overflow -- proves verify-matrix's
     overflow check actually fails when it should. */
  #overflow-trigger {
    display: none;
    width: 3000px;
    height: 8px;
    background: crimson;
  }
</style>
</head>
<body>

  <!-- Two same-page anchors for anchor-check.mjs -- their targets carry
       scroll-margin-top: var(--header-h), so a correct landing has the
       target's rect.top equal to --header-h, not 0. -->
  <nav>
    <a href="#filler-2">Jump to filler 2</a>
    <a href="#filler-4">Jump to filler 4</a>
  </nav>

  <section class="fit-section" data-fit="screen">
    <h1 data-stage-item style="font-size: calc(48 * var(--fluid-display))">one-screen section</h1>
  </section>

  <section class="filler"><p data-stage-item>filler 1</p></section>
  <section id="filler-2" class="filler"><p data-stage-item>filler 2</p></section>
  <section class="filler"><p data-stage-item>filler 3</p></section>
  <section id="filler-4" class="filler"><p data-stage-item>filler 4</p></section>
  <section class="filler"><p data-stage-item>bottom filler — proves the reveal step-scroll reached here</p></section>

  <div id="overflow-trigger"></div>

  <script>
    if (location.search.includes('overflow')) {
      document.getElementById('overflow-trigger').style.display = 'block';
    }

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) entry.target.classList.add('is-visible');
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('[data-stage-item]').forEach(function (el) { io.observe(el); });
  </script>
</body>
</html>
