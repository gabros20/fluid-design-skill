<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fluid-design — OG image source</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#12151d;
    background-image:
      radial-gradient(circle at 82% 18%, color-mix(in srgb, #f2cf3b 16%, transparent), transparent 42%),
      radial-gradient(circle at 8% 92%, color-mix(in srgb, #f2cf3b 10%, transparent), transparent 46%);
    color:#e6eaf3;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    position:relative;
  }
  .frame{
    position:absolute; inset:40px;
    border:1px solid #2b3245;
    border-radius:18px;
  }
  .content{
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:center;
    padding:0 96px;
  }
  .eyebrow{
    font-family:"Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
    text-transform:uppercase; letter-spacing:.18em; font-weight:600;
    font-size:19px; color:#93a0b8; margin-bottom:22px;
  }
  h1{
    font-size:104px; font-weight:500; letter-spacing:-.02em; line-height:1;
    margin-bottom:26px;
  }
  h1 .sl{color:#f2cf3b}
  .sub{
    font-family:"Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
    font-size:28px; color:#93a0b8; letter-spacing:.01em; margin-bottom:44px;
  }
  .chain{display:flex; align-items:center; gap:12px; margin-bottom:16px}
  .stages{
    font-family:"Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
    font-size:17px; color:#5d6a85; letter-spacing:.03em;
  }
  .stages b{color:#93a0b8; font-weight:600}
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="content">
    <div class="eyebrow">agent skill + CLI · Tailwind v4 · CSS · SCSS · StyleX</div>
    <h1><span class="sl">/</span>fluid-design</h1>
    <div class="sub">Viewport-fluid layouts that scale as one drawing</div>
    <div class="chain">
      <svg width="520" height="72" viewBox="0 0 520 72" aria-hidden="true">
        <rect x="1" y="8" width="90" height="56" rx="4" fill="#1a1f2b" stroke="#f2cf3b" stroke-width="2"/>
        <rect x="10" y="30" width="34" height="6" rx="1" fill="#e6eaf3"/><rect x="10" y="40" width="26" height="6" rx="1" fill="#e6eaf3"/><rect x="56" y="22" width="26" height="26" rx="2" fill="#5c4d12"/>
        <text x="112" y="41" fill="#f2cf3b" font-size="18" font-family="ui-monospace,Menlo,monospace">× --fluid</text>
        <rect x="222" y="8" width="115" height="56" rx="4" fill="#141824" stroke="#2b3245" stroke-width="1.5"/>
        <rect x="234.5" y="8" width="90" height="56" fill="#1a1f2b" stroke="#f2cf3b" stroke-width="1" stroke-dasharray="3 3"/>
        <rect x="243.5" y="30" width="34" height="6" rx="1" fill="#e6eaf3"/><rect x="243.5" y="40" width="26" height="6" rx="1" fill="#e6eaf3"/><rect x="289.5" y="22" width="26" height="26" rx="2" fill="#5c4d12"/>
        <rect x="357" y="8" width="100" height="56" rx="4" fill="#141824" stroke="#2b3245" stroke-width="1.5"/>
        <rect x="362" y="8" width="90" height="56" fill="#1a1f2b" stroke="#f2cf3b" stroke-width="1" stroke-dasharray="3 3"/>
        <rect x="371" y="30" width="34" height="6" rx="1" fill="#e6eaf3"/><rect x="371" y="40" width="26" height="6" rx="1" fill="#e6eaf3"/><rect x="417" y="22" width="26" height="26" rx="2" fill="#5c4d12"/>
              </svg>
    </div>
    <div class="stages"><b>--fluid = min(W / 1440, H / 900)</b> · <b>n × unit</b> → <b>bands</b> → <b>type roles</b> → <b>limits</b> → <b>fluid check</b></div>
  </div>
</body>
</html>
